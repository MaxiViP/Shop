services:
  db:
    image: postgres:18.6-bookworm
    container_name: shop-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop

    ports:
      - '5432:5432'

    volumes:
      - db:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db:
