name: korzinamarket

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in db.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in db.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in db.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker inside this volume.
      - shop_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  shop_pgdata:
    name: shop_pgdata
