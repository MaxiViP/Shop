# Install in /etc/nginx/sites-available/korzinamarket.conf (inside nginx's http context).
# HTTP bootstrap only. Certbot adds HTTPS and HTTP redirects after DNS is ready.
server {
    listen 80;
    listen [::]:80;
    server_name www.korzinamarket.ru;

    # Leave room for Certbot's more specific HTTP challenge location.
    location / {
        return 308 $scheme://korzinamarket.ru$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name korzinamarket.ru;

    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx is the public edge: never append an untrusted incoming XFF.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # No URI/trailing slash on proxy_pass: preserve the /api/ prefix.
        proxy_pass http://127.0.0.1:4001;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4001;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
