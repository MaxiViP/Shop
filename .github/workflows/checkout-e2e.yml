name: Checkout E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkout-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: checkout_e2e
          POSTGRES_PASSWORD: checkout_e2e_ci_only
          POSTGRES_DB: checkout_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkout_e2e -d checkout_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://checkout_e2e:checkout_e2e_ci_only@127.0.0.1:5432/checkout_e2e
      DATABASE_URL: postgresql://checkout_e2e:checkout_e2e_ci_only@127.0.0.1:5432/checkout_e2e
      DOTENV_CONFIG_PATH: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate --config prisma7.config.ts
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Typecheck application and test infrastructure
        run: |
          pnpm typecheck
          pnpm --filter api exec tsc --noEmit -p tsconfig.checkout.json
          pnpm --filter web exec tsc -p test/checkout/tsconfig.json
          node --check scripts/checkout-e2e.mjs
          node --check scripts/checkout-network.mjs
      - run: pnpm lint
      - run: pnpm build
      - name: Existing checkout regression tests
        run: >-
          node --test apps/web/test/checkout.test.mjs apps/web/test/cart-quote.test.mjs
          apps/web/test/delivery.test.mjs apps/web/test/pickup.test.mjs
          apps/web/test/preorder.test.mjs apps/web/test/order-mobile.test.mjs
      - name: Real API and PostgreSQL browser tests
        run: pnpm test:checkout
      - name: Upload reports, traces, screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-e2e-${{ github.run_id }}
          path: |
            work/checkout/artifacts/
            work/checkout/report/
          if-no-files-found: warn
          retention-days: 14
